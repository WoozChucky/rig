# CI runs on Linux only; Windows is checked locally before each push
# (spec section 9).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # The LLVM archive is 2 GB; what get_llvm.sh keeps of it is cached.
      - name: Cache LLVM
        id: llvm
        uses: actions/cache@v4
        with:
          path: deps/llvm-linux
          key: llvm-23.1.4-linux-${{ hashFiles('scripts/get_llvm.sh') }}

      - name: Get LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        run: scripts/get_llvm.sh

      - name: Build
        run: ./build.sh

      - name: rig version
        run: bin/rig version

      - name: Unit tests
        run: bin/unit-tests --self-test && bin/unit-tests
