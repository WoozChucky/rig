# CI runs on Linux only; Windows is checked locally before each push
# (spec section 9).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    # A whole run takes minutes (less with LLVM cached); a hang stops here
    # rather than at GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu image already has clang; install it only if not, so
      # an Ubuntu mirror being down can't fail the build.
      - name: Clang
        run: |
          if ! command -v clang++ > /dev/null; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          clang++ --version

      # The LLVM archive is 2 GB; what get_llvm.sh keeps of it is cached.
      - name: Cache LLVM
        id: llvm
        uses: actions/cache@v4
        with:
          path: deps/llvm-linux
          key: llvm-23.1.4-linux-${{ hashFiles('scripts/get_llvm.sh') }}

      - name: Get LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        run: scripts/get_llvm.sh

      - name: Build
        run: ./build.sh

      - name: rig version
        run: bin/rig version

      - name: Unit tests
        run: bin/unit-tests --self-test && bin/unit-tests

      # gdb, for the debugger tests (tests/debug): GitHub's Ubuntu image
      # has none. Required, so a gdb that can't start fails the run rather
      # than skipping them.
      - name: gdb
        run: sudo apt-get update && sudo apt-get install -y gdb && gdb --version | head -1

      - name: End-to-end tests
        env:
          RIG_DEBUGGER_TESTS: required
        run: bin/run-tests

      # The VS Code extension's checks (editors/vscode/test/check.js): not
      # the compiler's, and needing nothing but the Node the runner has.
      - name: VS Code extension
        run: node --version && node editors/vscode/test/check.js
